# Copy to config.yaml and edit. Secrets (ANTHROPIC_API_KEY, Google credentials) go in .env,
# never in this file. Folders are relative to this file.
input_dir: inbox
output_dir: output
move_files: true            # after a run, move PDFs into processed/ or needs-review/

model:
  default: claude-haiku-5-5
  escalate_to: claude-sonnet-5-5   # one retry for documents that fail the checks; null to skip
  max_pages: 20
  effort: null               # low | medium | high; null uses each model's default

validation:
  total_tolerance: "0.01"
  # Any ISO 4217 code can be added here, e.g. AUD, CAD, NZD, JPY.
  # An invoice in a currency not on this list goes to the review list.
  allowed_currencies: [USD, GBP, EUR]
  # Optional: extra or overriding symbols. A bare "$" means USD unless you remap it here.
  currency_symbols: {}
  #   "$": AUD

outputs:
  csv: true
  excel: true
  google_sheet:
    enabled: false
    spreadsheet_id: ""

suppliers:                  # optional hints for known suppliers, matched by name
  - name: Acme Packaging Ltd
    currency: GBP             # settles a shared symbol such as "$"
    # decimal_mark: ","       # "1.299,00" style; settles amounts like 12,125
    # date_order: day_first   # or month_first; settles dates like 03/09/2026
    # notes: "Total is in the box at the bottom left"   # passed to the model
