[project]
name = "ibis-docs"
version = "0.1.0"
description = "Ibis reads supplier invoices and packing slips, checks the numbers, and exports a clean sheet."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ibis = "ibis_docs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]
# Only needed to regenerate the fake demo invoices (demo/generate.py).
demo = [
    "pillow>=11.0",
    "pypdfium2>=4.30",
    "reportlab>=4.2",
]

[tool.uv]
default-groups = ["dev", "demo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibis_docs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
